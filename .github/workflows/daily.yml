name: Daily Scout

on:
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC every day (adjust to your morning)
  workflow_dispatch:       # allows manual run

jobs:
  run-scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install arxiv requests
          # For Ollama you would need a self-hosted runner or API instead

      - name: Run Scout
        run: python scout.py
        env:
          # Add any API keys here later if you switch from Ollama

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Scout report $(date +%Y-%m-%d)"
          git push
